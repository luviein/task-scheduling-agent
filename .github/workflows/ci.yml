name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs a model, a Google account, or the network. The test suite
# forces the mock calendar and disables task persistence, so CI can never book a
# real event or rewrite a real task list.
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Tool schemas build without a key
        run: python tools.py > /dev/null

      - run: pytest

  web:
    name: Client typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run build
